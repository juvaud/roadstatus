spring.application.name=roadstatus
logging.level.org.springframework.web=DEBUG

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/roadstatusdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=roadstatus
spring.datasource.password=roadstatus
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connection pool settings
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Enable retry on connection failure
spring.datasource.hikari.initialization-fail-timeout=60000

# Enable graceful shutdown
spring.lifecycle.timeout-per-shutdown-phase=20s

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Water Level API Configuration
water.level.api.url=https://www.hochwasser.rlp.de/api/v1/measurement-site/26500100

# Elevation API Configuration
elevation.api.url=https://api.open-elevation.com/api/v1/lookup
